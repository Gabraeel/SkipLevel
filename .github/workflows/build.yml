# Gera o SkipLevel.exe no Windows e publica em Releases a cada envio para a main.
name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Gerar executavel
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SkipLevel --icon assets\icon.ico --add-data "assets;assets" --collect-all customtkinter main.py

      - uses: actions/upload-artifact@v4
        with:
          name: SkipLevel
          path: dist/SkipLevel.exe

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1.${{ github.run_number }}" dist/SkipLevel.exe --title "Skip Level v1.${{ github.run_number }}" --notes "Baixe o SkipLevel.exe e execute. Nao precisa instalar nada."
